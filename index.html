<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Algae–Daphnia Trophic Cascade Model</title>

    <style>
      body {
        font-family: system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #f1f5f9;
        margin: 14px;
        color: #0f172a;
      }
      .container {
        max-width: 1180px;
        margin: 0 auto;
      }
      .card {
        background: #fff;
        padding: 14px;
        border-radius: 12px;
        box-shadow: 0 1px 8px rgba(2, 6, 23, 0.07);
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .col {
        flex: 1;
        min-width: 320px;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        background: #fff;
      }
      input[type="range"] {
        width: 100%;
      }
      button {
        padding: 7px 11px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
      }
      .legend {
        display: flex;
        gap: 14px;
        margin-top: 10px;
        font-size: 13px;
        align-items: center;
        flex-wrap: wrap;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
      }
      .small {
        font-size: 13px;
        color: #374151;
      }
      .control-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .quick-btn {
        background: #e2e8f0;
        border-radius: 7px;
        padding: 4px 9px;
        cursor: pointer;
      }
      .section-title {
        margin: 0 0 10px 0;
      }
      .note {
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
      }
      .mode-toggle {
        display: inline-flex;
        gap: 6px;
        padding: 4px;
        border-radius: 10px;
        background: #e2e8f0;
        margin-bottom: 10px;
      }
      .mode-btn {
        padding: 7px 12px;
        border-radius: 8px;
        background: transparent;
        border: none;
      }
      .mode-btn.active {
        background: #0369a1;
        color: white;
      }
      .slider-group {
        margin-bottom: 14px;
      }
    </style>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useRef, useState } = React;

      function AlgaeDaphniaModel() {
        const SIM_DURATION = 14.0;
        const CHECK_DAY = 7.0;
        const VOLUME_ML = 50.0;
        const INITIAL_ALGAE_CONC = 460000;
        const DEFAULT_DAPHNIA = 12;
        const DEFAULT_NUTRIENT = 1;
        const dt = 0.01;
        const stepsPerFrame = 6;

        const [mode, setMode] = useState("topDown");
        const [startNutrientLevel, setStartNutrientLevel] = useState(DEFAULT_NUTRIENT);
        const [startAlgae, setStartAlgae] = useState(INITIAL_ALGAE_CONC);
        const [startDaphnia, setStartDaphnia] = useState(DEFAULT_DAPHNIA);

        const [nutrient, setNutrient] = useState(DEFAULT_NUTRIENT);
        const [algaeConc, setAlgaeConc] = useState(INITIAL_ALGAE_CONC);
        const [daphnia, setDaphnia] = useState(DEFAULT_DAPHNIA);
        const [timeDays, setTimeDays] = useState(0);
        const [running, setRunning] = useState(false);
        const [history, setHistory] = useState([]);

        const dishRef = useRef(null);
        const algaePlotRef = useRef(null);
        const daphniaPlotRef = useRef(null);
        const rafRef = useRef(null);

        const simRef = useRef({
          t: 0,
          nutrient: DEFAULT_NUTRIENT,
          algae: INITIAL_ALGAE_CONC,
          daphnia: DEFAULT_DAPHNIA,
          lastHistoryT: 0,
        });

        function clamp(v, lo, hi) {
          return Math.max(lo, Math.min(hi, v));
        }

        function nutrientFactor(level) {
          if (level <= 0) return 0;
          if (level >= 2) return 2;
          return 1;
        }

        function resetSimulation(nextNutrient = startNutrientLevel, nextAlgae = startAlgae, nextDaphnia = startDaphnia) {
          const nextState = {
            t: 0,
            nutrient: nextNutrient,
            algae: nextAlgae,
            daphnia: nextDaphnia,
            lastHistoryT: 0,
          };

          simRef.current = nextState;
          setTimeDays(0);
          setNutrient(nextNutrient);
          setAlgaeConc(nextAlgae);
          setDaphnia(nextDaphnia);
          setHistory([
            {
              t: 0,
              nutrient: nextNutrient,
              algae: nextAlgae,
              daphnia: nextDaphnia,
            },
          ]);
          setRunning(false);
        }

        useEffect(() => {
          resetSimulation(startNutrientLevel, startAlgae, startDaphnia);
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [mode]);

        function targetsForState(state) {
          const nf = nutrientFactor(state.nutrient);
          const algaeInput = Math.max(0, state.algae);
          const daphniaInput = Math.max(0, state.daphnia);

          if (mode === "topDown") {
            const algaeTarget = clamp(
              900000 + 90000 * nf - 5500 * daphniaInput,
              30000,
              1600000
            );
            const daphniaTarget = clamp(
              14 + 7 * nf + 0.00001 * algaeInput + 0.03 * daphniaInput,
              0,
              100
            );
            const nutrientTarget = clamp(
              0.9 + 0.05 * nf + 0.0000012 * algaeInput + 0.002 * daphniaInput,
              0,
              2.5
            );
            return { algaeTarget, daphniaTarget, nutrientTarget };
          }

          const nutrientBoost = 0.65 + 0.55 * nf;
          const algaeTarget = clamp(
            140000 + 240000 * nutrientBoost + 0.10 * algaeInput,
            0,
            1900000
          );
          const daphniaTarget = clamp(
            8 + 10 * nutrientBoost + 0.00003 * algaeTarget,
            0,
            120
          );
          const nutrientTarget = clamp(
            0.1 + 0.25 * nf + 0.0000006 * algaeInput + 0.001 * daphniaInput,
            0,
            2.5
          );
          return { algaeTarget, daphniaTarget, nutrientTarget };
        }

        function derivatives(state) {
          const targets = targetsForState(state);
          const algaeRelax = mode === "topDown" ? 1.8 : 1.25;
          const daphniaRelax = mode === "topDown" ? 1.35 : 1.15;
          const nutrientRelax = 0.9;

          const dN = (targets.nutrientTarget - state.nutrient) * nutrientRelax;
          const dA = (targets.algaeTarget - state.algae) * algaeRelax;
          const dD = (targets.daphniaTarget - state.daphnia) * daphniaRelax;
          return [dN, dA, dD];
        }

        function rk4Step(state, dtDays) {
          const [k1N, k1A, k1D] = derivatives(state);
          const s2 = {
            nutrient: state.nutrient + 0.5 * dtDays * k1N,
            algae: state.algae + 0.5 * dtDays * k1A,
            daphnia: state.daphnia + 0.5 * dtDays * k1D,
          };
          const [k2N, k2A, k2D] = derivatives(s2);
          const s3 = {
            nutrient: state.nutrient + 0.5 * dtDays * k2N,
            algae: state.algae + 0.5 * dtDays * k2A,
            daphnia: state.daphnia + 0.5 * dtDays * k2D,
          };
          const [k3N, k3A, k3D] = derivatives(s3);
          const s4 = {
            nutrient: state.nutrient + dtDays * k3N,
            algae: state.algae + dtDays * k3A,
            daphnia: state.daphnia + dtDays * k3D,
          };
          const [k4N, k4A, k4D] = derivatives(s4);

          const next = {
            t: state.t + dtDays,
            nutrient: state.nutrient + (dtDays / 6) * (k1N + 2 * k2N + 2 * k3N + k4N),
            algae: state.algae + (dtDays / 6) * (k1A + 2 * k2A + 2 * k3A + k4A),
            daphnia: state.daphnia + (dtDays / 6) * (k1D + 2 * k2D + 2 * k3D + k4D),
            lastHistoryT: state.lastHistoryT,
          };

          next.nutrient = clamp(next.nutrient, 0, 2.5);
          next.algae = Math.max(0, next.algae);
          next.daphnia = Math.max(0, next.daphnia);
          return next;
        }

        function advanceSimulation() {
          let cur = { ...simRef.current };
          const points = [];
          let lastRecorded = cur.lastHistoryT;

          for (let i = 0; i < stepsPerFrame; i++) {
            cur = rk4Step(cur, dt);
            if (cur.t - lastRecorded >= 0.05 || cur.t >= SIM_DURATION) {
              points.push({ t: cur.t, nutrient: cur.nutrient, algae: cur.algae, daphnia: cur.daphnia });
              lastRecorded = cur.t;
            }
            if (cur.t >= SIM_DURATION) break;
          }

          cur.lastHistoryT = lastRecorded;
          simRef.current = cur;

          setTimeDays(cur.t);
          setNutrient(cur.nutrient);
          setAlgaeConc(cur.algae);
          setDaphnia(cur.daphnia);

          if (points.length) {
            setHistory((prev) => {
              const next = [...prev, ...points];
              return next.slice(-3000);
            });
          }

          if (cur.t >= SIM_DURATION) setRunning(false);
        }

        useEffect(() => {
          if (!running) {
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
            return;
          }
          function loop() {
            advanceSimulation();
            rafRef.current = requestAnimationFrame(loop);
          }
          rafRef.current = requestAnimationFrame(loop);
          return () => {
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
          };
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [running]);

        function drawDish() {
          const canvas = dishRef.current;
          if (!canvas) return;
          canvas.width = 980;
          canvas.height = 620;
          const ctx = canvas.getContext("2d");
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h / 2;
          const R = Math.min(w, h) / 2 - 40;

          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(cx, cy, R, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#94a3b8";
          ctx.lineWidth = 6;
          ctx.stroke();

          function randomPointInDish() {
            const r = Math.sqrt(Math.random()) * (R - 10);
            const theta = Math.random() * Math.PI * 2;
            return { x: cx + r * Math.cos(theta), y: cy + r * Math.sin(theta) };
          }

          const algaeDots = clamp(Math.round((algaeConc / INITIAL_ALGAE_CONC) * 520), 40, 1200);
          for (let i = 0; i < algaeDots; i++) {
            const p = randomPointInDish();
            ctx.fillStyle = "rgba(34,197,94,0.55)";
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
            ctx.fill();
          }

          const daphniaDots = clamp(Math.round(daphnia), 0, 180);
          for (let i = 0; i < daphniaDots; i++) {
            const p = randomPointInDish();
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(((Math.random() - 0.5) * Math.PI) / 5);
            ctx.beginPath();
            ctx.ellipse(0, 0, 7.5, 5.0, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#f97316";
            ctx.fill();
            ctx.restore();
          }

          ctx.fillStyle = "#0f172a";
          ctx.font = "16px system-ui, -apple-system, sans-serif";
          ctx.fillText(`Time: ${timeDays.toFixed(2)} days`, 18, 28);
          ctx.fillText(`Nutrient level: ${nutrient.toFixed(2)}x`, 18, 52);
          ctx.fillText(`Algae: ${Math.round(algaeConc).toLocaleString()} cells/mL`, 18, 76);
          ctx.fillText(`Total algae in 50 mL jar: ${Math.round(algaeConc * VOLUME_ML).toLocaleString()} cells`, 18, 100);
          ctx.fillText(`Daphnia: ${Math.round(daphnia)}`, 18, 124);
          ctx.fillStyle = "#0369a1";
          ctx.fillText(`Week 1 check at day ${CHECK_DAY.toFixed(0)} (plots marked below)`, 18, 152);
        }

        function drawPlot(canvasRef, hist, options) {
          const canvas = canvasRef.current;
          if (!canvas) return;
          canvas.width = 980;
          canvas.height = 240;
          const ctx = canvas.getContext("2d");

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const margin = { l: 72, r: 22, t: 14, b: 42 };
          const W = canvas.width - margin.l - margin.r;
          const H = canvas.height - margin.t - margin.b;
          const values = hist.length ? hist.map(options.valueFn) : [0];
          const vmax = Math.max(...values, 1);
          const Ymax = vmax * 1.15;

          const sx = (t) => margin.l + ((t - 0) / SIM_DURATION) * W;
          const sy = (v) => margin.t + (1 - v / Ymax) * H;

          ctx.strokeStyle = "#eef2f7";
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let i = 0; i <= 5; i++) {
            const y = margin.t + (i / 5) * H;
            ctx.moveTo(margin.l, y);
            ctx.lineTo(margin.l + W, y);
          }
          ctx.stroke();

          ctx.strokeStyle = "#334155";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(margin.l, margin.t);
          ctx.lineTo(margin.l, margin.t + H);
          ctx.lineTo(margin.l + W, margin.t + H);
          ctx.stroke();

          const weekX = sx(CHECK_DAY);
          ctx.setLineDash([7, 5]);
          ctx.strokeStyle = "#64748b";
          ctx.beginPath();
          ctx.moveTo(weekX, margin.t);
          ctx.lineTo(weekX, margin.t + H);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.fillStyle = "#64748b";
          ctx.font = "12px system-ui, -apple-system, sans-serif";
          ctx.fillText("Week 1", weekX - 18, margin.t + 10);

          ctx.fillStyle = "#374151";
          ctx.font = "12px system-ui, -apple-system, sans-serif";
          for (let i = 0; i <= 5; i++) {
            const v = Ymax * (1 - i / 5);
            const y = margin.t + (i / 5) * H;
            ctx.fillText(options.formatY(v), 8, y + 4);
          }

          for (let day = 0; day <= SIM_DURATION; day++) {
            const x = sx(day);
            ctx.fillText(String(day), x - 5, margin.t + H + 20);
            ctx.beginPath();
            ctx.moveTo(x, margin.t + H);
            ctx.lineTo(x, margin.t + H + 6);
            ctx.stroke();
          }

          if (hist.length >= 2) {
            ctx.beginPath();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = options.color;
            hist.forEach((pt, i) => {
              const x = sx(pt.t);
              const y = sy(options.valueFn(pt));
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.stroke();
          }

          ctx.fillStyle = options.color;
          ctx.fillRect(canvas.width - 190, margin.t + 7, 11, 11);
          ctx.fillStyle = "#334155";
          ctx.font = "13px system-ui, -apple-system, sans-serif";
          ctx.fillText(options.label, canvas.width - 170, margin.t + 17);
          ctx.fillText("Time (days)", margin.l + W / 2 - 30, canvas.height - 12);
        }

        useEffect(() => {
          drawDish();
          drawPlot(algaePlotRef, history, {
            color: "#22c55e",
            label: "Algae (million cells/mL)",
            valueFn: (pt) => pt.algae / 1e6,
            formatY: (v) => v.toFixed(2),
          });
          drawPlot(daphniaPlotRef, history, {
            color: "#f97316",
            label: "Daphnia (count)",
            valueFn: (pt) => pt.daphnia,
            formatY: (v) => Math.round(v).toString(),
          });
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [timeDays, nutrient, algaeConc, daphnia, history]);

        function startPause() {
          if (!running && simRef.current.t >= SIM_DURATION) {
            resetSimulation(startNutrientLevel, startAlgae, startDaphnia);
            setRunning(true);
            return;
          }
          setRunning((r) => !r);
        }

        function resetAll() {
          resetSimulation(startNutrientLevel, startAlgae, startDaphnia);
        }

        const topDown = mode === "topDown";

        return (
          <div className="container">
            <h2 style={{ marginBottom: 6 }}>Algae–Daphnia Trophic Cascade Model</h2>
            <p className="small" style={{ marginTop: 0 }}>
              Start algae is fixed at <strong>460,000 cells/mL</strong> by default. Students can switch between
              top-down and bottom-up control while still adjusting all starting values.
            </p>

            <div className="card" style={{ marginBottom: 12 }}>
              <div className="small" style={{ marginBottom: 6 }}><strong>Model mode</strong></div>
              <div className="mode-toggle" role="tablist" aria-label="Model mode toggle">
                <button className={`mode-btn ${topDown ? "active" : ""}`} onClick={() => setMode("topDown")}>Top-down control</button>
                <button className={`mode-btn ${!topDown ? "active" : ""}`} onClick={() => setMode("bottomUp")}>Bottom-up control</button>
              </div>
              <div className="small">
                Top-down makes daphnia the main driver of algae loss. Bottom-up makes nutrients the main driver of algae growth,
                which then raises daphnia.
              </div>
            </div>

            <div className="row">
              <div className="col card">
                <canvas ref={dishRef} style={{ width: "100%", height: 380 }} />
                <div className="control-row">
                  <button
                    onClick={startPause}
                    style={{ background: running ? "#ef4444" : "#0369a1", color: "#fff" }}
                  >
                    {running ? "Pause" : timeDays >= SIM_DURATION ? "Restart" : "Start"}
                  </button>
                  <button onClick={resetAll}>Reset</button>
                </div>

                <div className="legend">
                  <div><span className="dot" style={{ background: "#22c55e" }}></span>Algae</div>
                  <div><span className="dot" style={{ background: "#f97316" }}></span>Daphnia</div>
                </div>

                <div className="note small">
                  <div>Time: <strong>{timeDays.toFixed(2)} / {SIM_DURATION}</strong> days{timeDays >= SIM_DURATION ? " (finished)" : ""}</div>
                  <div style={{ marginTop: 4 }}>Nutrient: <strong>{nutrient.toFixed(2)}x</strong></div>
                  <div style={{ marginTop: 4 }}>Algae: <strong>{Math.round(algaeConc).toLocaleString()}</strong> cells/mL</div>
                  <div style={{ marginTop: 4 }}>Daphnia: <strong>{Math.round(daphnia)}</strong></div>
                </div>
              </div>

              <div className="col card">
                <h4 className="section-title">Controls</h4>

                <div className="slider-group">
                  <div className="small" style={{ marginBottom: 6 }}>
                    Starting daphnia count {topDown ? "(top-down focus)" : "(bottom-up feedback)"}
                  </div>
                  <input type="range" min={0} max={80} step={1} value={startDaphnia} disabled={running} onChange={(e) => setStartDaphnia(+e.target.value)} />
                  <div className="small">Daphnia: <strong>{Math.round(startDaphnia)}</strong></div>
                </div>

                <div className="slider-group">
                  <div className="small" style={{ marginBottom: 6 }}>Starting algae concentration</div>
                  <input type="range" min={100000} max={1500000} step={10000} value={startAlgae} disabled={running} onChange={(e) => setStartAlgae(+e.target.value)} />
                  <div className="small">Algae: <strong>{Math.round(startAlgae).toLocaleString()}</strong> cells/mL</div>
                </div>

                <div className="slider-group">
                  <div className="small" style={{ marginBottom: 6 }}>Starting nutrient level</div>
                  <input type="range" min={0} max={2} step={1} value={startNutrientLevel} disabled={running} onChange={(e) => setStartNutrientLevel(+e.target.value)} />
                  <div className="small">Level: <strong>{startNutrientLevel}x</strong></div>
                  <div className="small" style={{ marginTop: 6 }}>
                    Quick: {" "}
                    <button className="quick-btn" onClick={() => setStartNutrientLevel(0)} disabled={running}>0x</button>{" "}
                    <button className="quick-btn" onClick={() => setStartNutrientLevel(1)} disabled={running}>1x</button>{" "}
                    <button className="quick-btn" onClick={() => setStartNutrientLevel(2)} disabled={running}>2x</button>
                  </div>
                </div>

                <div className="note small">
                  In top-down mode, higher daphnia should push algae lower. In bottom-up mode, 2x nutrients should give the highest algae
                  and daphnia, 1x should be in the middle, and 0 should be the lowest.
                </div>
              </div>
            </div>

            <div style={{ marginTop: 12 }} className="card">
              <h4 className="section-title">Time-series</h4>
              <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 14 }}>
                <div>
                  <div className="small" style={{ marginBottom: 6 }}>Algae (green)</div>
                  <canvas ref={algaePlotRef} style={{ width: "100%", height: 220 }} />
                </div>
                <div>
                  <div className="small" style={{ marginBottom: 6 }}>Daphnia (orange)</div>
                  <canvas ref={daphniaPlotRef} style={{ width: "100%", height: 220 }} />
                </div>
              </div>
              <div className="small" style={{ marginTop: 8 }}>
                The dashed vertical line marks the one-week check at day 7.
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<AlgaeDaphniaModel />);
    </script>
  </body>
</html>
