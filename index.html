<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
  const { useState, useRef, useEffect } = React;

  function Model() {
    const SIM_DURATION = 14;
    const CHECKPOINT = 7;
    const VOLUME = 6;

    const [N, setN] = useState(6000);
    const [A, setA] = useState(28);
    const [D, setD] = useState(2);
    const [running, setRunning] = useState(false);

    const canvasRef = useRef(null);
    const tRef = useRef(0);

    function draw() {
      const canvas = canvasRef.current;
      canvas.width = 800;
      canvas.height = 500;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0,0,800,500);

      ctx.fillStyle = "#000";
      ctx.fillText("Time: " + tRef.current.toFixed(2), 20, 20);
      ctx.fillText("Nutrient: " + Math.round(N), 20, 40);
      ctx.fillText("Algae: " + Math.round(A), 20, 60);
      ctx.fillText("Daphnia: " + Math.round(D), 20, 80);
    }

    function step() {
      const dt = 0.01;

      let n = N;
      let a = A;
      let d = D;

      const growth = 1.2 * (n / (200 + n)) * a;
      const grazing = (0.02 * a) / (1 + 0.02 * 0.06 * a) * d;

      const dN = -0.02*n*a + 0.2*a + 0.1*d + 10;
      const dA = growth - grazing - 0.04*a;
      const dD = 0.3*grazing - 0.03*d;

      n += dN * dt;
      a += dA * dt;
      d += dD * dt;

      setN(Math.max(0,n));
      setA(Math.max(0,a));
      setD(Math.max(0,d));

      tRef.current += dt;
      draw();

      if (tRef.current < SIM_DURATION) {
        requestAnimationFrame(step);
      } else {
        setRunning(false);
      }
    }

    function start() {
      if (!running) {
        setRunning(true);
        step();
      }
    }

    return (
      <div>
        <h2>Nutrient → Algae → Daphnia</h2>
        <canvas ref={canvasRef}></canvas>
        <button onClick={start}>Start</button>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Model />);
</script>
