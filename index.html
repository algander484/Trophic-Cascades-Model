<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nutrient–Algae–Daphnia Model</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body { font-family: Arial, sans-serif; background:#f1f5f9; margin:20px; color:#0f172a; }
canvas { border:1px solid #ccc; margin-top:10px; background:#fff; }
button { margin-right: 8px; margin-top: 10px; padding: 8px 12px; }
.small { color:#475569; font-size: 13px; }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

function Model() {
  const SIM_DURATION = 14;

  const [N, setN] = useState(6000);
  const [A, setA] = useState(45000000);
  const [D, setD] = useState(2);
  const [running, setRunning] = useState(false);

  const tRef = useRef(0);
  const canvasRef = useRef(null);

  function draw() {
    const c = canvasRef.current;
    if (!c) return;
    const ctx = c.getContext("2d");

    c.width = 800;
    c.height = 500;

    ctx.clearRect(0, 0, 800, 500);

    const cx = 400;
    const cy = 260;
    const R = 200;

    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 4;
    ctx.stroke();

    function randPoint() {
      const r = Math.sqrt(Math.random()) * (R - 10);
      const t = Math.random() * Math.PI * 2;
      return { x: cx + r * Math.cos(t), y: cy + r * Math.sin(t) };
    }

    for (let i = 0; i < 180; i++) {
      const p = randPoint();
      ctx.fillStyle = "rgba(234,179,8,0.25)";
      ctx.fillRect(p.x, p.y, 1.5, 1.5);
    }

    const algaeDots = Math.min(220, Math.round(A / 300000));
    for (let i = 0; i < algaeDots; i++) {
      const p = randPoint();
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 5, 3, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#22c55e";
      ctx.fill();
    }

    const daphniaDots = Math.min(80, Math.max(0, Math.round(D * 4)));
    for (let i = 0; i < daphniaDots; i++) {
      const p = randPoint();

      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 7, 4, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#f97316";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(p.x + 2, p.y - 1, 1.2, 0, Math.PI * 2);
      ctx.fillStyle = "#000";
      ctx.fill();
    }

    ctx.fillStyle = "#0f172a";
    ctx.font = "16px system-ui";
    ctx.fillText("Time: " + tRef.current.toFixed(2), 20, 20);
    ctx.fillText("Nutrient: " + Math.round(N), 20, 40);
    ctx.fillText("Algae: " + Math.round(A).toLocaleString(), 20, 60);
    ctx.fillText("Daphnia: " + D.toFixed(2), 20, 80);
  }

  function step() {
    const dt = 0.01;

    let n = N;
    let a = A;
    let d = D;

    const growth = 1.6 * (n / (300 + n)) * a;
    const grazing = (0.003 * a) / (1 + 0.003 * 0.08 * a) * d;

    const dN = -0.00000002 * n * a + 0.15 * a + 0.05 * d + 8;
    const dA = growth - grazing - 0.02 * a;
    const dD = 0.25 * grazing - 0.02 * d;

    n += dN * dt;
    a += dA * dt;
    d += dD * dt;

    n = Math.max(0, n);
    a = Math.max(0, a);
    d = Math.max(0, d);

    setN(n);
    setA(a);
    setD(d);

    tRef.current += dt;
    draw();

    if (tRef.current < SIM_DURATION) {
      requestAnimationFrame(step);
    } else {
      setRunning(false);
    }
  }

  function start() {
    if (!running) {
      setRunning(true);
      step();
    }
  }

  function reset() {
    tRef.current = 0;
    setN(6000);
    setA(45000000);
    setD(2);
    setRunning(false);
    draw();
  }

  useEffect(() => {
    draw();
  }, []);

  return (
    <div>
      <h2>Nutrient → Algae → Daphnia</h2>
      <p className="small">Two-week run with green algae and orange daphnia.</p>
      <canvas ref={canvasRef}></canvas>
      <br />
      <button onClick={start}>Start</button>
      <button onClick={reset}>Reset</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Model />);
</script>

</body>
</html>
